<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin · GT Studio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="w">
<section class="card" id="login" style="max-width:420px;margin:60px auto 0">
 <span class="k">GT Studio</span>
 <h2 style="margin-top:6px">Painel admin</h2>
 <form id="lf" novalidate>
  <div class="fld" style="margin-bottom:12px"><label for="em">E-mail</label><input id="em" type="email" autocomplete="username" value="fastx.ytr@gmail.com"></div>
  <div class="fld" style="margin-bottom:14px"><label for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password"></div>
  <button class="b" type="submit" style="width:100%">Entrar</button>
  <p class="st e" id="le" role="alert"></p>
 </form>
</section>

<div id="app" hidden>
 <div class="hd"><div><span class="k">GT Studio</span><h1 style="font-size:26px;margin:2px 0 0">Contratos</h1></div>
  <div class="act" style="margin:0"><button class="o" id="csv" type="button">Baixar CSV</button><button class="o" id="out" type="button">Sair</button></div></div>
 <div class="tabs"><button class="o" id="t1" type="button" aria-pressed="true">Novo contrato</button><button class="o" id="t2" type="button" aria-pressed="false">Contratos <span id="cnt"></span></button></div>

 <section class="card" id="p1">
  <h2>Montar contrato</h2>
  <div class="g">
   <div><label for="cl">Nome do cliente</label><input id="cl" type="text" placeholder="Ex.: Dinamic Imóveis"></div>
   <div><label for="pk">Pacote base</label><select id="pk"><option>Básico</option><option>Intermediário</option><option selected>Completo</option><option>Personalizado</option></select></div>
  </div>
  <div class="g3" style="margin-top:14px">
   <div><label for="vl">Valor total (R$)</label><input id="vl" type="text" inputmode="decimal"></div>
   <div><label for="ep">Entrada (%)</label><input id="ep" type="text" inputmode="numeric" value="30"></div>
   <div><label for="vd">Dia do restante</label><input id="vd" type="text" inputmode="numeric" value="5"></div>
   <div><label for="pz">Prazo (dias)</label><input id="pz" type="text" inputmode="numeric" value="7"></div>
   <div><label for="aj">Rodadas de ajustes</label><input id="aj" type="text" inputmode="numeric"></div>
  </div>
  <div style="margin-top:14px"><label for="it">O que está incluso (um item por linha)</label><textarea id="it"></textarea></div>
  <div style="margin-top:14px"><label for="pm">Texto da promoção (opcional, aparece na cláusula de valor)</label><textarea id="pm" style="min-height:70px" placeholder="Ex.: Condição promocional de Black Friday, válida somente neste mês. Depois, o valor normal é R$ 1.200,00."></textarea></div>
  <div class="act" style="justify-content:flex-start"><button class="b" id="gen" type="button">Gerar link do contrato</button></div>
  <p class="st e" id="ge" role="alert"></p>
  <div id="res" hidden>
   <h2 style="margin-top:18px">Link pronto para enviar</h2>
   <div class="lk" id="lnk"></div>
   <div class="act" style="justify-content:flex-start"><button class="b" id="cl1" type="button">Copiar link</button><button class="o" id="cl2" type="button">Copiar mensagem para WhatsApp</button></div>
   <p class="st" id="rs" role="status"></p>
  </div>
 </section>

 <section class="card" id="p2" hidden>
  <div class="g" style="grid-template-columns:1fr"><div><label for="q">Buscar</label><input id="q" type="search" placeholder="Cliente, empresa ou CNPJ"></div></div>
  <div class="tw" style="margin-top:12px"><table><thead><tr><th>Criado</th><th>Cliente</th><th>Pacote</th><th>Valor</th><th>Status</th></tr></thead><tbody id="tb"></tbody></table></div>
  <p class="note" id="empty" hidden>Nenhum contrato ainda.</p>
  <p class="st e" id="ae" role="alert"></p>
 </section>
</div>
</main>
<dialog id="dg"><h2 id="dt"></h2><dl id="dd"></dl><div class="act" style="justify-content:flex-start" id="da"></div><p class="st" id="ds" role="status"></p></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="contrato.js"></script>
<script src="fx.js"></script>
<script>
const G = window.GT || {};
const $ = s => document.querySelector(s);
const esc = CT.esc;
const dt = s => s ? new Date(s).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) : "";
const sb = (window.supabase && G.SUPABASE_URL && !/COLE_AQUI/.test(G.SUPABASE_URL)) ? window.supabase.createClient(G.SUPABASE_URL, G.SUPABASE_ANON_KEY) : null;
let rows = [], cur = null;

const PRE = {
  "Básico": { v: 800, aj: 1, it: ["4 vídeos editados para Reels e Stories", "10 fotos editadas com tratamento de cor", "Captação com equipamento profissional", "Edição com trilha sonora e legendas"] },
  "Intermediário": { v: 1000, aj: 2, it: ["6 vídeos editados para Reels e Stories", "15 fotos editadas com tratamento de cor", "Captação com equipamento profissional", "Edição com trilha sonora e legendas", "Roteiro personalizado"] },
  "Completo": { v: 1200, aj: 3, it: ["10 vídeos editados para Reels e Stories", "40 fotos editadas com tratamento de cor", "Captação com equipamento profissional", "Edição com trilha sonora e legendas", "Roteiro personalizado", "Estratégia de postagem e marketing", "Postagens no Instagram feitas pelo GT Studio, com estratégias de alcance e autoridade", "Acompanhamento de resultados do perfil", "Prioridade no agendamento das captações"] }
};
function preset() {
  const p = PRE[$("#pk").value]; if (!p) return;
  $("#vl").value = p.v; $("#aj").value = p.aj; $("#it").value = p.it.join("\n");
}
$("#pk").addEventListener("change", preset); preset();

function show(on) { $("#login").hidden = on; $("#app").hidden = !on; }
function tab(n) { $("#p1").hidden = n !== 1; $("#p2").hidden = n !== 2; $("#t1").setAttribute("aria-pressed", n === 1); $("#t2").setAttribute("aria-pressed", n === 2); }
$("#t1").addEventListener("click", () => tab(1)); $("#t2").addEventListener("click", () => tab(2));

function link(id) { return new URL("index.html?c=" + id, location.href).href; }
function draw() {
  const q = $("#q").value.trim().toLowerCase();
  const list = rows.filter(r => !q || [r.cliente, r.empresa, r.cnpj].join(" ").toLowerCase().includes(q));
  $("#tb").innerHTML = list.map(r => `<tr data-id="${esc(r.id)}"><td>${esc(dt(r.criado_em))}</td><td>${esc(r.cliente)}</td><td>${esc(r.pacote)}</td><td>${esc(CT.brl(r.valor))}</td><td><span class="bd ${r.status === "assinado" ? "s" : ""}">${r.status === "assinado" ? "Assinado" : "Pendente"}</span></td></tr>`).join("");
  $("#cnt").textContent = "(" + rows.length + ")"; $("#empty").hidden = rows.length > 0;
}
async function load() {
  $("#ae").textContent = "";
  const { data, error } = await sb.from("contratos").select("*").order("criado_em", { ascending: false });
  if (error) { $("#ae").textContent = "Não foi possível carregar os contratos."; return; }
  rows = data || []; draw();
}
async function enter() { const { data } = await sb.auth.getSession(); if (data && data.session) { show(true); load(); } else show(false); }
if (!sb) $("#le").textContent = "Configure o config.js com os dados do Supabase."; else enter();

$("#lf").addEventListener("submit", async e => {
  e.preventDefault(); $("#le").textContent = ""; if (!sb) return;
  const { error } = await sb.auth.signInWithPassword({ email: $("#em").value.trim(), password: $("#pw").value });
  $("#pw").value = "";
  if (error) {
    const m = String(error.message || "");
    $("#le").textContent = /not confirmed/i.test(m) ? "Este e-mail ainda não foi confirmado no Supabase." : /invalid login/i.test(m) ? "E-mail ou senha incorretos." : "Não foi possível entrar: " + m;
    return;
  }
  enter();
});
$("#out").addEventListener("click", async () => { await sb.auth.signOut(); rows = []; show(false); });
$("#q").addEventListener("input", draw);

const num = s => Number(String(s).trim().replace(/\./g, "").replace(",", "."));
function msg(r) { return `Olá! Segue o contrato do pacote ${r.pacote} (${CT.brl(r.valor)}). Preencha seus dados e assine por este link:\n${link(r.id)}`; }
function copy(t, el) { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => el.textContent = "Copiado.", () => el.textContent = "Não foi possível copiar. Selecione o texto e copie."); }
let last = null;
$("#gen").addEventListener("click", async () => {
  const ge = $("#ge"); ge.textContent = ""; $("#res").hidden = true;
  const t = { cliente: $("#cl").value.trim(), pacote: $("#pk").value, valor: num($("#vl").value), entrada_pct: num($("#ep").value), vencimento_dia: num($("#vd").value),
    prazo_dias: num($("#pz").value), ajustes: num($("#aj").value), itens: $("#it").value.trim(), promo_texto: $("#pm").value.trim() || null };
  const int = (n, a, b) => Number.isInteger(n) && n >= a && n <= b;
  if (t.cliente.length < 2) return ge.textContent = "Informe o nome do cliente.";
  if (!(t.valor > 0)) return ge.textContent = "Informe um valor válido.";
  if (!int(t.entrada_pct, 1, 100)) return ge.textContent = "A entrada deve ser de 1 a 100%.";
  if (!int(t.vencimento_dia, 1, 28)) return ge.textContent = "O dia do restante deve ser de 1 a 28.";
  if (!int(t.prazo_dias, 1, 365)) return ge.textContent = "Informe o prazo em dias.";
  if (!int(t.ajustes, 0, 50)) return ge.textContent = "Informe as rodadas de ajustes.";
  if (t.itens.length < 3) return ge.textContent = "Liste o que está incluso.";
  const { data, error } = await sb.from("contratos").insert([t]).select().single();
  if (error) { ge.textContent = "Não foi possível criar o contrato."; return; }
  last = data; rows.unshift(data); draw();
  $("#lnk").textContent = link(data.id); $("#rs").textContent = ""; $("#res").hidden = false;
});
$("#cl1").addEventListener("click", () => copy(link(last.id), $("#rs")));
$("#cl2").addEventListener("click", () => copy(msg(last), $("#rs")));

$("#tb").addEventListener("click", e => {
  const tr = e.target.closest("tr"); if (!tr) return;
  cur = rows.find(r => r.id === tr.dataset.id); if (!cur) return;
  const k = CT.calc(cur), L = [["Cliente", cur.cliente], ["Pacote", cur.pacote], ["Valor", CT.brl(cur.valor) + " · entrada " + cur.entrada_pct + "% (" + CT.brl(k.entrada) + ")"], ["Status", cur.status === "assinado" ? "Assinado em " + dt(cur.assinado_em) : "Pendente"]];
  if (cur.status === "assinado") L.push(["Empresa", cur.empresa], ["CNPJ", cur.cnpj], ["Representante", cur.representante], ["CPF", cur.cpf], ["Endereço", cur.endereco], ["Contato", cur.contato], ["Assinatura", cur.assinatura], ["Restante em", String(cur.vencimento).split("-").reverse().join("/")]);
  $("#dt").textContent = "Contrato"; $("#dd").innerHTML = L.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join("");
  $("#da").innerHTML = (cur.status === "assinado" ? `<button class="b" data-a="dl" type="button">Baixar contrato</button>` : `<button class="b" data-a="lk" type="button">Copiar link</button><button class="o" data-a="wa" type="button">Mensagem WhatsApp</button>`) + `<button class="o" data-a="rm" type="button">Excluir</button><button class="o" data-a="x" type="button">Fechar</button>`;
  $("#ds").textContent = ""; $("#dg").showModal();
});
$("#da").addEventListener("click", async e => {
  const a = e.target.closest("button"); if (!a) return;
  const act = a.dataset.a, ds = $("#ds");
  if (act === "x") $("#dg").close();
  else if (act === "lk") copy(link(cur.id), ds);
  else if (act === "wa") copy(msg(cur), ds);
  else if (act === "dl") { const l = document.createElement("a"); l.href = URL.createObjectURL(new Blob([CT.doc(cur, G)], { type: "text/html;charset=utf-8" })); l.download = "contrato-" + cur.cliente.replace(/\W+/g, "-").toLowerCase() + ".html"; document.body.appendChild(l); l.click(); l.remove(); }
  else if (act === "rm") {
    if (!confirm("Excluir este contrato? Isso não pode ser desfeito.")) return;
    const { error } = await sb.from("contratos").delete().eq("id", cur.id);
    if (error) { ds.textContent = "Não foi possível excluir."; return; }
    rows = rows.filter(r => r.id !== cur.id); draw(); $("#dg").close();
  }
});
$("#csv").addEventListener("click", () => {
  const cell = v => { v = String(v == null ? "" : v); if (/^[=+\-@\t\r]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
  const head = ["criado_em", "status", "cliente", "pacote", "valor", "entrada_pct", "vencimento_dia", "prazo_dias", "ajustes", "empresa", "cnpj", "representante", "cpf", "endereco", "contato", "assinatura", "assinado_em", "vencimento"];
  const out = [head.join(",")].concat(rows.map(r => head.map(h => cell(r[h])).join(","))).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + out], { type: "text/csv;charset=utf-8" }));
  a.download = "contratos-gt-studio.csv"; document.body.appendChild(a); a.click(); a.remove();
});
</script>
</body>
</html>
